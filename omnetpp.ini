[General]
network = AlohaNetwork
sim-time-limit = 100s
repeat = 5
cmdenv-express-mode = true

*.N = 20
**.packetBits = 1000
**.dataRate = 1e6
**.ackTimeout = 1.5ms
**.backoffK = 10
**.queueCapacity = 20
**.maxRetries = 0
**.vector-recording = false

# ============================================================
# Scenario 1: Pure ALOHA - HIGH LOAD
# ============================================================
[Config PureAloha_High]
description = "Scenario 1: Pure ALOHA - High load"
*.slotted = false
*.Gnew = 1.5


# ============================================================
# Scenario 2: Pure ALOHA - MODERATE LOAD (near theoretical peak)
# ============================================================
[Config PureAloha_Moderate]
description = "Scenario 2: Pure ALOHA - Moderate load (Gnew=0.5)"
*.slotted = false
*.Gnew = 0.5


# ============================================================
# Scenario 3: Pure ALOHA - LOW LOAD
# ============================================================
[Config PureAloha_Low]
description = "Scenario 3: Pure ALOHA - Low load"
*.slotted = false
*.Gnew = 0.1


# ============================================================
# Scenario 4: Slotted ALOHA - HIGH LOAD
# ============================================================
[Config SlottedAloha_High]
description = "Scenario 4: Slotted ALOHA - High load"
*.slotted = true
*.Gnew = 1.5


# ============================================================
# Scenario 5: Slotted ALOHA - MODERATE LOAD (near theoretical peak)
# ============================================================
[Config SlottedAloha_Moderate]
description = "Scenario 5: Slotted ALOHA - Moderate load (Gnew=1.0)"
*.slotted = true
*.Gnew = 1.0


# ============================================================
# Scenario 6: Slotted ALOHA - LOW LOAD
# ============================================================
[Config SlottedAloha_Low]
description = "Scenario 6: Slotted ALOHA - Low load"
*.slotted = true
*.Gnew = 0.1


# ============================================================
# Trace configurations (short runs for event/sequence inspection)
# ============================================================
[Config PureAloha_Trace]
extends = PureAloha_Moderate
sim-time-limit = 0.3s
repeat = 1
record-eventlog = true


[Config SlottedAloha_Trace]
extends = SlottedAloha_Moderate
sim-time-limit = 0.3s
repeat = 1
record-eventlog = true

